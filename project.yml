name: GanZhiTodo
options:
  bundleIdPrefix: com.workbuddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

schemes:
  GanZhiTodo:
    build:
      targets:
        GanZhiTodo: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  GanZhiTodo:
    type: application
    platform: iOS
    sources:
      - path: GanZhiTodo
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.ganzhitodo
        INFOPLIST_FILE: GanZhiTodo/Info.plist
        CODE_SIGN_ENTITLEMENTS: GanZhiTodo/GanZhiTodo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: GanZhiTodoWidget
        embed: true

  GanZhiTodoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GanZhiTodoWidget
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.workbuddy.ganzhitodo.widget
        INFOPLIST_FILE: GanZhiTodoWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: GanZhiTodoWidget/GanZhiTodoWidget.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
